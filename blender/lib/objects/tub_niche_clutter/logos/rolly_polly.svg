  <path d="M28 62 q9 8 18 0" stroke="#1d3a8a" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="72" y="70" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="40" font-weight="700" fill="#ffffff">Rolly Polly</text>
