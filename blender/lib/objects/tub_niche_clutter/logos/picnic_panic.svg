<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160">
  <!-- Parody ant bait "Picnic Panic": a red-and-white gingham square with a running black ant, over a two-line blue italic wordmark. Drawn from scratch. -->
  <rect x="64" y="6" width="72" height="56" fill="#ffffff"/>
  <g fill="#d8343c"><rect x="64" y="6" width="18" height="14"/><rect x="100" y="6" width="18" height="14"/><rect x="82" y="20" width="18" height="14"/><rect x="118" y="20" width="18" height="14"/><rect x="64" y="34" width="18" height="14"/><rect x="100" y="34" width="18" height="14"/><rect x="82" y="48" width="18" height="14"/><rect x="118" y="48" width="18" height="14"/></g>
  <g fill="#111111"><circle cx="86" cy="40" r="7"/><ellipse cx="100" cy="40" rx="6" ry="5"/><ellipse cx="116" cy="40" rx="10" ry="7"/></g>
  <g stroke="#111111" stroke-width="2.5"><line x1="98" y1="44" x2="90" y2="56"/><line x1="102" y1="44" x2="106" y2="56"/><line x1="100" y1="36" x2="94" y2="26"/><line x1="84" y1="34" x2="78" y2="24"/></g>
  <text x="100" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-size="30" font-weight="700" fill="#1a3aa0">PICNIC</text>
  <text x="100" y="138" text-anchor="middle" font-family="Arial, sans-serif" font-style="italic" font-size="30" font-weight="700" fill="#1a3aa0">PANIC</text>
</svg>
