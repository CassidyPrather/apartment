  <g fill="#e8e8e4">
    <circle cx="44" cy="56" r="16"/>
    <circle cx="62" cy="44" r="18"/>
    <circle cx="80" cy="56" r="14"/>
    <rect x="30" y="56" width="62" height="14" rx="7"/>
    <text x="108" y="68" font-family="Segoe UI, Arial, sans-serif" font-size="46" font-weight="700">grumbleworks</text>
  </g>
</svg>
