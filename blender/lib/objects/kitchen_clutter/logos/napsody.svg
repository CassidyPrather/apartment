<svg xmlns="http://www.w3.org/2000/svg" width="360" height="110" viewBox="0 0 360 110">
  <!-- Parody napkin brand "Napsody": three coloured musical-note dots on a staff line and a white italic wordmark on blue. Drawn from scratch. -->
  <rect x="0" y="0" width="360" height="110" rx="14" fill="#2f86c9"/>
  <line x1="18" y1="72" x2="96" y2="72" stroke="#ffffff" stroke-width="3"/>
  <circle cx="32" cy="64" r="10" fill="#f2c230"/><line x1="41" y1="64" x2="41" y2="28" stroke="#ffffff" stroke-width="3"/>
  <circle cx="58" cy="56" r="10" fill="#e2474b"/><line x1="67" y1="56" x2="67" y2="22" stroke="#ffffff" stroke-width="3"/>
  <circle cx="84" cy="66" r="10" fill="#57b85a"/><line x1="93" y1="66" x2="93" y2="30" stroke="#ffffff" stroke-width="3"/>
  <text x="108" y="74" font-family="Arial, Helvetica, sans-serif" font-style="italic" font-weight="700" font-size="50" fill="#ffffff">napsody</text>
</svg>
