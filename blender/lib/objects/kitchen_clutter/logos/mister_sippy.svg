  <path d="M32 36 q-6 -8 0 -14 q6 -6 0 -14" fill="none" stroke="#bdbdbd" stroke-width="3" stroke-linecap="round"/>
  <text x="96" y="66" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="40" letter-spacing="3" fill="#ffffff">MISTER SIPPY</text>
</svg>
