<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <!-- Parody seasoning brand "Pinchy": a blue rounded badge with a white wordmark and a little pinching crab claw, over a red italic "sprinkle!" tag. Drawn from scratch. -->
  <rect x="10" y="6" width="200" height="54" rx="27" fill="#1f4fa0" stroke="#ffffff" stroke-width="4"/>
  <path d="M28 44 q-6 -22 12 -26 q10 -2 12 8 l-10 4 l10 4 q-4 14 -24 10 z" fill="#ffffff"/>
  <text x="62" y="48" textLength="140" lengthAdjust="spacingAndGlyphs" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="34" fill="#ffffff">Pinchy</text>
  <text x="40" y="98" textLength="150" lengthAdjust="spacingAndGlyphs" font-family="Georgia, serif" font-style="italic" font-weight="700" font-size="34" fill="#d22a2a">sprinkle!</text>
</svg>
