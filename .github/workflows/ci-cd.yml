name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check meta files
        run: scripts/check-meta.sh

      - name: Validate package manifests
        run: scripts/check-manifests.py

      - name: Check formatting
        run: scripts/format.sh --check

      - name: Run tests
        run: scripts/test.sh
